<title>영업관리 시스템</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,700;112,800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE work: an internal sales tool used daily by account managers
   IDEA a Swiss railway timetable: stages are stations, deals travel left to right
   PICTURE the pipeline funnel drawn as horizontal bars, weighted part in signal red
   COLOUR white ground, black ink, signal red accent, one grey
   TYPE Archivo wide for numerals and titles + Noto Sans KR
   LAYOUT top bar + tab strip; title row with action; content grids stack under 600px */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0e0e0e);--ink:light-dark(#111,#f1f1f1);--mut:light-dark(#6b6b6b,#a3a3a3);--line:light-dark(#dedede,#2c2c2c);--surf:light-dark(#f4f4f4,#181818);--red:light-dark(#e4002b,#ff3b52);--redt:light-dark(#fde6ea,#3a1219);--ok:light-dark(#0a7d3b,#4fd18a);--okt:light-dark(#e3f4ea,#12301f);--warn:light-dark(#9a6400,#f0b444);--warnt:light-dark(#fff3d9,#33270d)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;margin:0}
.num,.big,h1{font-family:Archivo,"Noto Sans KR",sans-serif;font-stretch:112%}
.pad{padding-left:max(4vw,16px,env(safe-area-inset-left,0px));padding-right:max(4vw,16px,env(safe-area-inset-right,0px))}
header{border-top:6px solid var(--ink);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.top{display:flex;align-items:center;gap:16px;padding-block:12px 4px;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;letter-spacing:-.02em}
.brand b{color:var(--red)}
#net{font-size:13px;color:var(--mut);margin-left:auto}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav a{padding:10px 12px;color:var(--mut);text-decoration:none;font-weight:700;white-space:nowrap;border-bottom:3px solid transparent}
nav a.on{color:var(--ink);border-color:var(--red)}
nav a:hover{color:var(--ink)}
main{padding-block:24px 64px;max-width:1400px}
.head{display:flex;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:clamp(28px,4vw,40px);line-height:1.05;letter-spacing:-.02em;margin:0;font-weight:800}
.head p{margin:4px 0 0;color:var(--mut)}
.head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
h2{font-size:18px;margin:0 0 10px;letter-spacing:-.01em}
.btn{font:inherit;font-weight:700;border:1px solid var(--ink);background:var(--bg);color:var(--ink);padding:9px 14px;border-radius:4px;cursor:pointer;min-height:40px}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:4px 10px;min-height:32px;font-size:13px}
.btn:hover{opacity:.85}
.btn:focus-visible,nav a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.ro .w{display:none!important}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(10.5em,1fr));gap:0;border-top:3px solid var(--ink);margin-bottom:28px}
.kpi{padding:12px 16px 12px 0;border-bottom:1px solid var(--line)}
.kpi span{display:block;font-size:13px;color:var(--mut)}
.kpi .big{font-size:clamp(24px,3vw,32px);font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.kpi small{color:var(--mut);font-size:13px;margin-left:4px}
.kpi.alert .big{color:var(--red)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:32px;margin-bottom:28px}
.sec{border-top:1px solid var(--ink);padding-top:12px}
.funnel .row{display:grid;grid-template-columns:7em minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.bar{height:26px;background:var(--surf);position:relative;border-radius:2px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.bar i.w{background:var(--red)}
.bar.thin{height:8px}
.funnel .val{text-align:right;white-space:nowrap;font-size:14px}
.funnel .val b{font-family:Archivo,sans-serif;font-stretch:112%}
.legend{display:flex;gap:16px;font-size:13px;color:var(--mut);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.list{list-style:none;margin:0;padding:0}
.list li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:baseline;cursor:pointer}
.list li:hover{background:var(--surf)}
.list .t{font-weight:700}
.list .s{color:var(--mut);font-size:13px}
.list .r{white-space:nowrap;font-size:13px;text-align:right}
.empty{color:var(--mut);padding:14px 0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:700;color:var(--mut);font-size:13px;border-bottom:2px solid var(--ink);padding:8px 8px;white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surf)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surf);white-space:nowrap}
.chip.red{background:var(--redt);color:var(--red)}
.chip.ok{background:var(--okt);color:var(--ok)}
.chip.warn{background:var(--warnt);color:var(--warn)}
.chip.ink{background:var(--ink);color:var(--bg)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters select,.filters input{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);min-height:38px}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.seg button{font:inherit;font-size:14px;font-weight:700;border:0;background:var(--bg);color:var(--ink);padding:7px 14px;cursor:pointer;min-height:38px}
.seg button.on{background:var(--ink);color:var(--bg)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surf);border-radius:4px;padding:10px;min-height:200px}
.col h3{font-size:14px;margin:0 0 4px;display:flex;justify-content:space-between}
.col .sum{font-size:13px;color:var(--mut);margin-bottom:10px;border-bottom:3px solid var(--ink);padding-bottom:6px}
.col.won .sum{border-color:var(--red)}
.card{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px;margin-bottom:8px;cursor:pointer}
.card:hover{border-color:var(--ink)}
.card .t{font-weight:700;font-size:14px;line-height:1.35}
.card .s{font-size:12px;color:var(--mut);margin:2px 0 6px}
.card .f{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px}
.card select{font:inherit;font-size:12px;padding:2px 4px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink)}
.rep{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:24px}
.rep .who{display:flex;justify-content:space-between;align-items:baseline;border-top:3px solid var(--ink);padding-top:8px}
.rep .who b{font-size:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.month .row{display:grid;grid-template-columns:5.5em minmax(0,1fr) 7em;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.month .bar i.w{background:color-mix(in srgb,var(--red) 45%,transparent)}
.month .bar i.k{background:var(--red)}
.month .cur{font-weight:800}
.hero-empty{border-top:3px solid var(--ink);padding:40px 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:center}
.hero-empty h2{font-size:28px;line-height:1.2}
.track{display:flex;align-items:center;gap:0;margin:8px 0}
.track span{flex:1;text-align:center;font-size:13px;font-weight:700;padding-top:22px;position:relative}
.track span::before{content:"";position:absolute;top:6px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--bg);border:3px solid var(--ink);z-index:1}
.track span::after{content:"";position:absolute;top:11px;left:0;right:0;height:3px;background:var(--ink)}
.track span:last-child::before{background:var(--red);border-color:var(--red)}
.ov{position:fixed;inset:0;background:rgb(0 0 0/.45);z-index:20;display:flex;justify-content:center;align-items:flex-start;padding:max(4vh,16px) 12px;overflow-y:auto}
.panel{background:var(--bg);color:var(--ink);width:100%;max-width:760px;border-top:6px solid var(--ink);border-radius:4px;padding:20px 22px 22px}
.panel h2{font-size:22px;display:flex;justify-content:space-between;gap:12px}
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 16px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}
.fld.w2{grid-column:1/-1}
.fld input,.fld select,.fld textarea{font:inherit;font-size:16px;font-weight:400;padding:8px 10px;border:1px solid color-mix(in srgb,var(--ink) 30%,transparent);border-radius:4px;background:var(--bg);color:var(--ink);width:100%}
.fld .hint{font-weight:400;color:var(--mut)}
.pfoot{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;align-items:center}
.pfoot .sp{flex:1}
.err{color:var(--red);font-size:14px;font-weight:700}
.calc{grid-column:1/-1;background:var(--surf);padding:10px 12px;border-radius:4px;font-size:14px;display:flex;gap:20px;flex-wrap:wrap}
.calc b{font-family:Archivo,sans-serif;font-stretch:112%}
.linked{margin-top:18px;border-top:1px solid var(--ink);padding-top:10px}
.note{font-size:13px;color:var(--mut);margin-top:24px}
.banner{background:var(--warnt);color:var(--warn);padding:10px 14px;border-radius:4px;margin-bottom:16px;font-size:14px;font-weight:700}
@media(max-width:900px){.grid2,.hero-empty{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.form{grid-template-columns:minmax(0,1fr)}table{font-size:13px}th,td{padding:6px 4px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:2px 4px;text-align:right}.stack td::before{content:attr(data-l);color:var(--mut);font-size:12px;text-align:left}.stack tfoot td{border:0}.funnel .row{grid-template-columns:5em minmax(0,1fr) auto}.month .row{grid-template-columns:4.5em minmax(0,1fr) 5.5em}}
</style>

<header>
  <div class="top pad"><span class="brand">영업관리 <b>●</b> Sales Hub</span><span id="net">연결 중…</span></div>
  <nav class="pad" id="nav">
    <a href="#home">대시보드</a><a href="#act">영업활동</a><a href="#opp">영업기회</a><a href="#pl">Pipeline/손익</a><a href="#appr">수주·품의</a><a href="#cust">고객</a><a href="#ar">채권</a><a href="#vendor">사후관리</a>
  </nav>
</header>
<main class="pad" id="main"></main>
<div id="modal"></div>

<script>
{
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const fmt=n=>Math.round(num(n)).toLocaleString('ko-KR');
const pct=(a,b)=>b?(Math.round(a/b*1000)/10):0;
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const NOW=new Date();const TODAY=ymd(NOW);const YEAR=String(NOW.getFullYear());const MONTH=TODAY.slice(0,7);
const addDays=n=>{const d=new Date(NOW);d.setDate(d.getDate()+n);return ymd(d)};

const STAGES=[{k:'잠재',p:10},{k:'기회',p:30},{k:'VRB',p:50},{k:'제안·협상',p:70},{k:'수주',p:100},{k:'실주',p:0}];
const prob=o=>(o.prob!==null&&o.prob!==undefined&&o.prob!=='')?num(o.prob):(STAGES.find(s=>s.k===o.stage)?.p??0);
const gp=o=>num(o.amount)-num(o.cost);
const isOpen=o=>!['수주','실주'].includes(o.stage);

const SCHEMA={
 opps:{name:'영업기회',fields:[
  {k:'name',l:'기회명',req:1,w:2},{k:'customer',l:'고객사',t:'cust',req:1},{k:'stage',l:'단계',t:'sel',opt:STAGES.map(s=>s.k),def:'잠재'},
  {k:'dept',l:'본부',t:'list',src:'dept'},{k:'owner',l:'영업담당',t:'list',src:'owner'},{k:'product',l:'솔루션/상품',t:'list',src:'product'},
  {k:'closeDate',l:'예상 수주일',t:'date'},{k:'amount',l:'예상 매출 (백만원)',t:'num'},{k:'cost',l:'예상 원가 (백만원)',t:'num'},
  {k:'prob',l:'확도 %',t:'num',hint:'비우면 단계 기본값'},{k:'compete',l:'경쟁사'},{k:'lostReason',l:'실주 사유',w:2},{k:'note',l:'메모',t:'ta',w:2}]},
 activities:{name:'영업활동',fields:[
  {k:'date',l:'활동일',t:'date',req:1,def:()=>TODAY},{k:'type',l:'활동 유형',t:'sel',opt:['방문','미팅','전화','데모/PoC','제안발표','기타']},
  {k:'customer',l:'고객사',t:'cust'},{k:'oppId',l:'관련 영업기회',t:'opp'},{k:'title',l:'제목',req:1,w:2},
  {k:'content',l:'활동 내용',t:'ta',w:2},{k:'next',l:'다음 액션',w:2},{k:'owner',l:'영업담당',t:'list',src:'owner'}]},
 approvals:{name:'품의',fields:[
  {k:'kind',l:'품의 구분',t:'sel',opt:['원가산정','수주품의','실행/판매품의','검수조건부/Demo','계약','구매요청','판매직접비']},
  {k:'status',l:'상태',t:'sel',opt:['작성중','결재요청','승인','반려'],def:'작성중'},{k:'oppId',l:'관련 영업기회',t:'opp',w:2},
  {k:'title',l:'제목',req:1,w:2},{k:'amount',l:'금액 (백만원)',t:'num'},{k:'cost',l:'원가 (백만원)',t:'num'},
  {k:'requester',l:'요청자',t:'list',src:'owner'},{k:'approver',l:'결재자'},{k:'memo',l:'품의 내용 / 결재 의견',t:'ta',w:2}]},
 customers:{name:'고객',fields:[
  {k:'name',l:'고객사명',req:1},{k:'kind',l:'구분',t:'sel',opt:['매출처','End User','파트너']},{k:'industry',l:'업종',t:'list',src:'industry'},
  {k:'owner',l:'영업담당',t:'list',src:'owner'},{k:'contact',l:'고객 담당자'},{k:'phone',l:'연락처'},{k:'email',l:'이메일',w:2},{k:'note',l:'메모',t:'ta',w:2}]},
 receivables:{name:'채권',fields:[
  {k:'customer',l:'고객사',t:'cust',req:1},{k:'oppId',l:'관련 영업기회',t:'opp'},{k:'invoiceDate',l:'세금계산서 발행일',t:'date'},
  {k:'dueDate',l:'회수 예정일',t:'date'},{k:'amount',l:'채권액 (백만원)',t:'num',req:1},{k:'collected',l:'회수액 (백만원)',t:'num'},
  {k:'owner',l:'영업담당',t:'list',src:'owner'},{k:'plan',l:'회수 계획',t:'ta',w:2}]},
 vendors:{name:'협력업체 평가',fields:[
  {k:'name',l:'협력업체',req:1,t:'list',src:'vendor'},{k:'project',l:'프로젝트'},{k:'period',l:'수행 기간'},{k:'evaluator',l:'평가자',t:'list',src:'owner'},
  {k:'q',l:'품질 (1~5)',t:'num'},{k:'d',l:'납기 (1~5)',t:'num'},{k:'c',l:'협업 (1~5)',t:'num'},{k:'t',l:'기술력 (1~5)',t:'num'},{k:'comment',l:'평가 의견',t:'ta',w:2}]}
};
const D={};Object.keys(SCHEMA).forEach(k=>D[k]=[]);
const F={actSub:'list',oppSub:'board',plBy:'dept',rPeriod:'month'};
let db=null,canWrite=true,M=null;

const oppName=id=>{const o=D.opps.find(x=>x.id===id);return o?o.name:''};
const vScore=v=>{const a=['q','d','c','t'].map(k=>num(v[k])).filter(x=>x>0);return a.length?a.reduce((s,x)=>s+x,0)/a.length:0};
const arLeft=r=>Math.max(0,num(r.amount)-num(r.collected));
const arState=r=>arLeft(r)<=0?'완료':(r.dueDate&&r.dueDate<TODAY?'연체':'정상');
const uniq=a=>[...new Set(a.filter(Boolean))].sort();
const opts=(a,v,all)=>`<option value="">${esc(all)}</option>`+a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const stageChip=s=>`<span class="chip ${s==='수주'?'red':s==='실주'?'':'ink'}">${esc(s||'-')}</span>`;
const statChip=s=>`<span class="chip ${s==='승인'?'ok':s==='반려'?'red':s==='결재요청'?'warn':''}">${esc(s||'작성중')}</span>`;
const newBtn=(col,label)=>`<button class="btn pri w" data-new="${col}">+ ${esc(label||SCHEMA[col].name+' 등록')}</button>`;
const head=(t,p,acts='')=>`<div class="head"><div><h1>${esc(t)}</h1>${p?`<p>${p}</p>`:''}</div><div class="acts">${acts}</div></div>`;
const kpi=(l,v,u='',cls='')=>`<div class="kpi ${cls}"><span>${esc(l)}</span><b class="big">${v}</b><small>${esc(u)}</small></div>`;
const table=(cols,rows,col,foot)=>rows.length?`<div class="scroll"><table class="stack"><thead><tr>${cols.map(c=>`<th class="${c.n?'n':''}">${esc(c.l)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr data-edit="${col}:${esc(r.id)}">${cols.map(c=>`<td class="${c.n?'n':''}" data-l="${esc(c.l)}">${c.f?c.f(r):esc(r[c.k])}</td>`).join('')}</tr>`).join('')}</tbody>${foot||''}</table></div>`:`<p class="empty">조건에 맞는 데이터가 없습니다.</p>`;

function dl(){
 const L={customer:uniq([...D.customers.map(c=>c.name),...D.opps.map(o=>o.customer)]),
  owner:uniq([...D.opps.map(o=>o.owner),...D.activities.map(a=>a.owner),...D.customers.map(c=>c.owner),...D.approvals.map(a=>a.requester)]),
  dept:uniq(D.opps.map(o=>o.dept)),product:uniq(D.opps.map(o=>o.product)),industry:uniq(D.customers.map(c=>c.industry)),vendor:uniq(D.vendors.map(v=>v.name))};
 return Object.entries(L).map(([k,a])=>`<datalist id="dl_${k}">${a.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`).join('');
}

/* ---------- views ---------- */
function vHome(){
 const total=Object.values(D).reduce((s,a)=>s+a.length,0);

 `<div class="kpis">${kpi('진행 파이프라인',fmt(pipe),'백만원')}${kpi('가중 예상매출',fmt(wt),'백만원')}${kpi(YEAR+'년 수주',fmt(wonAmt),'백만원')}${kpi('수주 GP율',pct(wonGp,wonAmt),'%')}${kpi('미회수 채권',fmt(arL),'백만원',over.length?'alert':'')}${kpi('이번 달 영업활동',actM,'건')}</div>

}

 if(!db)return;const n=$('#net');n.textContent=add?'샘플 데이터를 넣는 중…':'샘플 데이터를 지우는 중…';
 try{if(add){const S=sampleSet();for(const[col,a]of Object.entries(S))for(const{id,...b}of a)await db.collection(col).doc(id).set({...b,createdAt:b.createdAt||Date.now()})}
  else{for(const col of Object.keys(SCHEMA))for(const x of D[col].filter(y=>y.sample))await db.collection(col).doc(x.id).delete()}
  n.textContent='저장됨'}catch(e){console.error(e);n.textContent='처리하지 못했습니다'}
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-close],[data-new],[data-edit],[data-flow],[data-set],[data-sample],#delBtn');if(!t)return;
 if(t.matches('select'))return;
 if(t.dataset.close!==undefined){if(e.target===t||t.tagName==='BUTTON')closeM();return}
 if(t.id==='delBtn'){if(!M.del){M.del=true;t.textContent='한 번 더 누르면 삭제';t.classList.add('red');return}try{await db.collection(M.col).doc(M.id).delete();closeM()}catch(x){$('#ferr').textContent='삭제하지 못했습니다.'}return}
 if(t.dataset.new){const opp=t.dataset.opp;openForm(t.dataset.new);if(opp){$('#f_oppId').value=opp;const o=D.opps.find(x=>x.id===opp);if($('#f_customer'))$('#f_customer').value=o?.customer||'';if(t.dataset.new==='approvals'&&o){$('#f_amount').value=o.amount??'';$('#f_cost').value=o.cost??'';$('#f_title').value=o.customer+' '+o.name;calc()}}return}
 if(t.dataset.edit){if(e.target.closest('button,select'))return;const[c,id]=t.dataset.edit.split(':');openForm(c,id);return}
 if(t.dataset.flow){const[id,s]=t.dataset.flow.split(':');const a=D.approvals.find(x=>x.id===id);if(!a)return;const{id:_,...r}=a;const b={...r,status:s,updatedAt:Date.now()};if(['승인','반려'].includes(s))b.decidedAt=TODAY;try{await db.collection('approvals').doc(id).set(b);if(s==='승인'&&a.kind==='수주품의'&&a.oppId)await winOpp(a.oppId)}catch(x){$('#net').textContent='저장하지 못했습니다'}return}
 if(t.dataset.set){const[k,v]=t.dataset.set.split('=');if(t.tagName==='TR')return;F[k]=v;render();return}
 if(t.dataset.sample){t.disabled=true;await sample(t.dataset.sample==='add')}
});
document.addEventListener('change',async e=>{
 const t=e.target;
 if(t.dataset.stage){const o=D.opps.find(x=>x.id===t.dataset.stage);if(!o)return;const{id:_,...r}=o;try{await db.collection('opps').doc(o.id).set({...r,stage:t.value,updatedAt:Date.now()})}catch(x){$('#net').textContent='저장하지 못했습니다';render()}return}
 if(t.dataset.f&&t.tagName==='SELECT'){F[t.dataset.f]=t.value;render()}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f&&t.tagName==='INPUT'){F[t.dataset.f]=t.value;render()}if(t.closest('#frm'))calc()});
document.addEventListener('submit',e=>{if(e.target.id==='frm')save(e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&M)closeM()});
addEventListener('hashchange',()=>{closeM();render();scrollTo(0,0)});

/* ---------- boot ---------- */
async function init(){
 render();const net=$('#net');
 if(!window.claude?.use){net.textContent='오프라인 미리보기';return}
 try{db=await window.claude.use('db')}catch(e){db=null}
 try{const u=await window.claude.use('user');if(u){const c=await u.can('data.write');if(c===false){canWrite=false;document.body.classList.add('ro')}}}catch(e){}
 if(!db){net.textContent='저장소 연결 불가';render();return}
 const cols=Object.keys(SCHEMA),done=new Set();
 const timer=setTimeout(()=>{if(done.size<cols.length)net.textContent='데이터 연결이 지연되고 있습니다'},10000);
 cols.forEach(c=>db.collection(c).onSnapshot(s=>{D[c]=s.docs.map(d=>({...d.data(),id:d.id}));if(!s.metadata.fromCache){done.add(c);if(done.size===cols.length){clearTimeout(timer);net.textContent=canWrite?'실시간 공유 중':'보기 전용'}}render();if(M&&M.id&&!D[M.col].some(x=>x.id===M.id))closeM()},err=>{clearTimeout(timer);net.textContent='데이터를 불러오지 못했습니다'}));
}
init();
}
</script>
