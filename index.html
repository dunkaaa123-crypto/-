<title>영업관리 시스템</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,700;112,800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE work: an internal sales system (ERP-style) used daily by account managers
   IDEA a Swiss railway timetable: stages are stations, deals travel left to right
   PICTURE the pipeline funnel as horizontal bars, weighted part in signal red
   COLOUR white ground, black ink, signal red accent, one grey
   TYPE Archivo wide for numerals and titles + Noto Sans KR
   LAYOUT top bar; left menu tree (대/중/소) + sheet tabs + sheet; tree becomes a drawer under 900px */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0e0e0e);--ink:light-dark(#111,#f1f1f1);--mut:light-dark(#6b6b6b,#a3a3a3);--line:light-dark(#dedede,#2c2c2c);--surf:light-dark(#f4f4f4,#181818);--side:light-dark(#f7f7f7,#141414);--red:light-dark(#e4002b,#ff3b52);--redt:light-dark(#fde6ea,#3a1219);--ok:light-dark(#0a7d3b,#4fd18a);--okt:light-dark(#e3f4ea,#12301f);--warn:light-dark(#9a6400,#f0b444);--warnt:light-dark(#fff3d9,#33270d)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;margin:0}
.num,.big,h1{font-family:Archivo,"Noto Sans KR",sans-serif;font-stretch:112%}
header{border-top:6px solid var(--ink);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:15;display:flex;align-items:center;gap:12px;height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-weight:800;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
.brand b{color:var(--red)}
#net{font-size:13px;color:var(--mut);margin-left:auto;white-space:nowrap}
#menuBtn{display:none}
.shell{display:grid;grid-template-columns:260px minmax(0,1fr)}
aside{position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;background:var(--side);border-right:1px solid var(--line);padding:12px 0 40px}
aside details{margin:0}
aside summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px}
aside summary::-webkit-details-marker{display:none}
aside summary::before{content:"";width:0;height:0;border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s;flex:none}
aside details[open]>summary::before{transform:rotate(90deg)}
.l1>summary{font-weight:800;font-size:15px;padding:10px 16px 6px;border-top:1px solid var(--line)}
.l1:first-child>summary{border-top:0}
.l2>summary{font-weight:700;font-size:14px;padding:5px 16px 5px 30px;color:var(--ink)}
.l3{display:block;padding:6px 16px 6px 50px;font-size:14px;color:var(--mut);text-decoration:none;border-left:3px solid transparent}
.l3:hover{color:var(--ink);background:var(--surf)}
.l3.on{color:var(--ink);font-weight:700;border-left-color:var(--red);background:var(--bg)}
.l3.opened::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mut);margin-left:6px;vertical-align:2px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--ink);padding:8px max(3vw,16px) 0;position:sticky;top:56px;background:var(--bg);z-index:10;scrollbar-width:thin}
.tab{flex:none;display:flex;align-items:center;border:1px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0;background:var(--surf);white-space:nowrap;font-size:13px}
.tab a{padding:7px 4px 7px 12px;color:var(--mut);text-decoration:none;font-weight:700}
.tab button{border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px;line-height:1;padding:6px 8px;min-height:32px}
.tab button:hover{color:var(--red)}
.tab.on{background:var(--bg);border-color:var(--ink);margin-bottom:-1px;padding-bottom:1px}
.tab.on a{color:var(--ink)}
main{padding:20px max(3vw,16px) 64px;max-width:1400px}
.crumb{font-size:13px;color:var(--mut);margin-bottom:4px}
.head{display:flex;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:clamp(26px,3.4vw,36px);line-height:1.05;letter-spacing:-.02em;margin:0;font-weight:800}
.head p{margin:6px 0 0;color:var(--mut);max-width:70ch}
.head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
h2{font-size:18px;margin:0 0 10px;letter-spacing:-.01em}
.btn{font:inherit;font-weight:700;border:1px solid var(--ink);background:var(--bg);color:var(--ink);padding:9px 14px;border-radius:4px;cursor:pointer;min-height:40px}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:4px 10px;min-height:32px;font-size:13px}
.btn.xs{padding:2px 8px;min-height:26px;font-size:12px;border-color:var(--line)}
.btn:hover{opacity:.85}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.ro .w{display:none!important}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(10.5em,1fr));border-top:3px solid var(--ink);margin-bottom:28px}
.kpi{padding:12px 16px 12px 0;border-bottom:1px solid var(--line)}
.kpi span{display:block;font-size:13px;color:var(--mut)}
.kpi .big{font-size:clamp(22px,2.6vw,30px);font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.kpi small{color:var(--mut);font-size:13px;margin-left:4px}
.kpi.alert .big{color:var(--red)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:32px;margin-bottom:28px}
.sec{border-top:1px solid var(--ink);padding-top:12px}
.funnel .row{display:grid;grid-template-columns:7em minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.bar{height:26px;background:var(--surf);position:relative;border-radius:2px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.bar i.w{background:var(--red)}
.bar.thin{height:8px}
.funnel .val{text-align:right;white-space:nowrap;font-size:14px}
.funnel .val b{font-family:Archivo,sans-serif;font-stretch:112%}
.legend{display:flex;gap:16px;font-size:13px;color:var(--mut);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.list{list-style:none;margin:0;padding:0}
.list li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:baseline;cursor:pointer}
.list li:hover{background:var(--surf)}
.list .t{font-weight:700}
.list .s{color:var(--mut);font-size:13px}
.list .r{white-space:nowrap;font-size:13px;text-align:right}
.empty{color:var(--mut);padding:14px 0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:700;color:var(--mut);font-size:13px;border-bottom:2px solid var(--ink);padding:8px;white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surf)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--surf);white-space:nowrap}
.chip.red{background:var(--redt);color:var(--red)}
.chip.ok{background:var(--okt);color:var(--ok)}
.chip.warn{background:var(--warnt);color:var(--warn)}
.chip.ink{background:var(--ink);color:var(--bg)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters select,.filters input{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);min-height:38px}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:700;border:0;background:var(--bg);color:var(--ink);padding:7px 14px;cursor:pointer;min-height:38px}
.seg button.on{background:var(--ink);color:var(--bg)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surf);border-radius:4px;padding:10px;min-height:200px}
.col h3{font-size:14px;margin:0 0 4px;display:flex;justify-content:space-between}
.col .sum{font-size:13px;color:var(--mut);margin-bottom:10px;border-bottom:3px solid var(--ink);padding-bottom:6px}
.col.won .sum{border-color:var(--red)}
.card{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px;margin-bottom:8px;cursor:pointer}
.card:hover{border-color:var(--ink)}
.card .t{font-weight:700;font-size:14px;line-height:1.35}
.card .s{font-size:12px;color:var(--mut);margin:2px 0 6px}
.card .f{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px}
.card select{font:inherit;font-size:12px;padding:2px 4px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink)}
.rep{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:24px}
.rep .who{display:flex;justify-content:space-between;align-items:baseline;border-top:3px solid var(--ink);padding-top:8px}
.rep .who b{font-size:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.month .row{display:grid;grid-template-columns:5.5em minmax(0,1fr) 7em;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.month .bar i.w{background:color-mix(in srgb,var(--red) 45%,transparent)}
.month .bar i.k{background:var(--red)}
.month .cur{font-weight:800}
.hero-empty{border-top:3px solid var(--ink);padding:40px 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:center}
.hero-empty h2{font-size:28px;line-height:1.2}
.track{display:flex;align-items:center;margin:8px 0}
.track span{flex:1;text-align:center;font-size:13px;font-weight:700;padding-top:22px;position:relative}
.track span::before{content:"";position:absolute;top:6px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--bg);border:3px solid var(--ink);z-index:1}
.track span::after{content:"";position:absolute;top:11px;left:0;right:0;height:3px;background:var(--ink)}
.track span:last-child::before{background:var(--red);border-color:var(--red)}
.ov{position:fixed;inset:0;background:rgb(0 0 0/.45);z-index:30;display:flex;justify-content:center;align-items:flex-start;padding:max(4vh,16px) 12px;overflow-y:auto}
.panel{background:var(--bg);color:var(--ink);width:100%;max-width:760px;border-top:6px solid var(--ink);border-radius:4px;padding:20px 22px 22px}
.panel h2{font-size:22px;display:flex;justify-content:space-between;gap:12px}
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 16px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}
.fld.w2{grid-column:1/-1}
.fld input,.fld select,.fld textarea{font:inherit;font-size:16px;font-weight:400;padding:8px 10px;border:1px solid color-mix(in srgb,var(--ink) 30%,transparent);border-radius:4px;background:var(--bg);color:var(--ink);width:100%}
.fld .hint{font-weight:400;color:var(--mut)}
.fld.load{background:var(--surf);padding:12px;border-radius:4px;border-left:4px solid var(--red)}
.fld.load input{border-color:var(--ink)}
.oppcard{font-weight:400;font-size:13px;display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:6px 16px;margin-top:6px}
.oppcard span{color:var(--mut);display:block;font-size:12px}
.oppcard b{font-size:14px}
.oppcard .wide{grid-column:1/-1}
.pfoot{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;align-items:center}
.pfoot .sp{flex:1}
.err{color:var(--red);font-size:14px;font-weight:700}
.calc{grid-column:1/-1;background:var(--surf);padding:10px 12px;border-radius:4px;font-size:14px;display:flex;gap:20px;flex-wrap:wrap}
.calc b{font-family:Archivo,sans-serif;font-stretch:112%}
.linked{margin-top:18px;border-top:1px solid var(--ink);padding-top:10px}
.note{font-size:13px;color:var(--mut);margin-top:24px}
.banner{background:var(--warnt);color:var(--warn);padding:10px 14px;border-radius:4px;margin-bottom:16px;font-size:14px;font-weight:700}
@media(max-width:900px){.grid2,.hero-empty{grid-template-columns:minmax(0,1fr)}.shell{grid-template-columns:minmax(0,1fr)}#menuBtn{display:inline-block}aside{position:fixed;left:0;top:56px;bottom:0;height:auto;width:min(300px,86vw);z-index:20;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 0 100vmax transparent}.navopen aside{transform:none;box-shadow:0 0 0 100vmax rgb(0 0 0/.35)}}
@media(max-width:600px){.form{grid-template-columns:minmax(0,1fr)}table{font-size:13px}th,td{padding:6px 4px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:2px 4px;text-align:right}.stack td::before{content:attr(data-l);color:var(--mut);font-size:12px;text-align:left}.stack tfoot td{border:0}.funnel .row{grid-template-columns:5em minmax(0,1fr) auto}.month .row{grid-template-columns:4.5em minmax(0,1fr) 5.5em}.brand{font-size:16px}}
@media(prefers-reduced-motion:reduce){aside,aside summary::before{transition:none}}
#me{font-size:13px;font-weight:700;white-space:nowrap}
#me .chip{margin-left:4px}
#me select{font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--ink);border-radius:4px;background:var(--bg);color:var(--ink);margin-right:8px}
.noadmin .adm{display:none!important}
.reg{border:2px solid var(--red);border-radius:4px;padding:14px 16px;margin-bottom:18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.reg b{font-size:16px}
.reg input{font:inherit;font-size:16px;padding:7px 10px;border:1px solid var(--ink);border-radius:4px;background:var(--bg);color:var(--ink);min-width:12em}
.fbanner{grid-column:1/-1;background:var(--redt);color:var(--red);padding:8px 12px;border-radius:4px;font-weight:700;font-size:14px}
.fld input[readonly]{background:var(--surf);font-weight:700}
.sub{grid-column:1/-1;font-size:13px;font-weight:800;border-bottom:1px solid var(--line);padding-top:6px;color:var(--mut)}
.qtable td,.qtable th{padding:6px 6px}
.qadd{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.qadd input{font:inherit;font-size:15px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);flex:1 1 8em}
.stg input[type=text],.stg input[type=number]{font:inherit;font-size:15px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:100%}
.stg input[type=number]{width:5em}
.stg label{white-space:nowrap;font-size:13px;margin-right:10px;display:inline-flex;gap:4px;align-items:center}
.stg td{vertical-align:middle}
.hbar .row{display:grid;grid-template-columns:8em minmax(0,1fr) 8em;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
@media(max-width:600px){#me{display:none}.hbar .row{grid-template-columns:6em minmax(0,1fr) 6em}}
</style>

<header>
  <button class="btn sm" id="menuBtn" aria-label="메뉴 열기">☰ 메뉴</button>
  <span class="brand">영업관리 <b>●</b> Sales Hub</span><span id="net">연결 중…</span><span id="me"></span>
</header>
<div class="shell">
  <aside id="tree" aria-label="시스템 메뉴"></aside>
  <section>
    <div class="tabs" id="tabs" role="tablist"></div>
    <main id="main"></main>
  </section>
</div>
<div id="modal"></div>

<script>
{
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const fmt=n=>Math.round(num(n)).toLocaleString('ko-KR');
const pct=(a,b)=>b?(Math.round(a/b*1000)/10):0;
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const NOW=new Date();const TODAY=ymd(NOW);const YEAR=String(NOW.getFullYear());const MONTH=TODAY.slice(0,7);
const addDays=n=>{const d=new Date(NOW);d.setDate(d.getDate()+n);return ymd(d)};
const blank=v=>v===undefined||v===null||v==='';
let ORGCFG={name:'AIDataPlatform',teams:[{id:'t1',name:'영업1팀'},{id:'t2',name:'영업2팀'}]};
const orgName=()=>ORGCFG.name||'AIDataPlatform';

/* ---------- 영업단계 (관리자 설정) ---------- */
const REQ_OPTS={amount:'매출 합계',cost:'예상 원가',closeDate:'예상 수주일',product:'솔루션/상품',partner:'매출처(파트너)',compete:'경쟁사'};
const DEF_OPEN=[{k:'잠재',p:10,req:[]},{k:'기회',p:30,req:[]},{k:'VRB',p:50,req:['amount','cost']},{k:'제안·협상',p:70,req:['amount','cost','closeDate']}];
let OPEN=DEF_OPEN,STAGES=[];
const setStages=l=>{OPEN=Array.isArray(l)&&l.length?l:DEF_OPEN;STAGES=[...OPEN,{k:'수주',p:100,req:['amount','cost','closeDate']},{k:'실주',p:0,req:[]}]};
setStages(null);
const prob=o=>!blank(o.prob)?num(o.prob):(STAGES.find(s=>s.k===o.stage)?.p??0);
const gp=o=>num(o.amount)-num(o.cost);
const isOpen=o=>!['수주','실주'].includes(o.stage);
const stageMissing=(o,st)=>(STAGES.find(s=>s.k===st)?.req||[]).filter(k=>k==='amount'?!num(o.amount):blank(o[k])).map(k=>REQ_OPTS[k]);
const COMPS=[['amtSW','SW 라이선스'],['amtHW','HW'],['amtSvc','용역(M/M)'],['amtMA','유지보수']];
const LOST_REASONS=['가격','기술/기능 부족','고객 관계','경쟁사 선호','예산 취소/보류','일정','기타'];
const KINDS={'p-cost':'원가산정','p-order':'수주품의','p-exec':'실행/판매품의','p-demo':'검수조건부/Demo','p-contract':'계약','p-purchase':'구매요청','p-direct':'판매직접비'};
const ROLES_L=['영업대표','팀장','사업부장'];
const normRole=r=>r==='본부장'?'사업부장':(ROLES_L.includes(r)?r:'영업대표');

/* ---------- 메뉴 트리 (대 / 중 / 소) ---------- */
const MENU=[
 {n:'영업',c:[
  {n:'리드',c:[['lead','리드 관리']]},
  {n:'영업활동',c:[['act','영업활동 등록·조회'],['actrep','Sales Activity Report']]},
  {n:'영업기회',c:[['oppboard','영업기회 단계 보드'],['opplist','영업기회 목록'],['lost','실주관리']]},
  {n:'매출처 / 고객관리',c:[['cust','매출처 / End User 관리']]}]},
 {n:'Pipeline / 손익',c:[
  {n:'현황',c:[['home','영업 대시보드']]},
  {n:'손익 전망',c:[['pl','Pipeline / 손익 집계'],['plmonth','월별 매출 전망']]}]},
 {n:'수주 / 계약',c:[
  {n:'수주 / 판품',c:[['p-cost','원가산정표'],['p-order','수주품의'],['p-exec','실행/판매품의'],['p-demo','검수조건부/Demo 진행현황']]},

function field(f,v){
 if(f.sub)return `<div class="sub">${esc(f.sub)}</div>`;
 const id='f_'+f.k;let inp;
 if(blank(v))v=typeof f.def==='function'?f.def():(f.def??'');
 if(f.t==='sel'){const op=typeof f.opt==='function'?f.opt():f.opt;if(v&&!op.includes(v))op.push(v);inp=`<select id="${id}">${op.map(o=>`<option value="${esc(o)}" ${o===v?'selected':''}>${esc(o||'(변경 없음)')}</option>`).join('')}</select>`}
 else if(f.t==='ta')inp=`<textarea id="${id}" rows="3">${esc(v)}</textarea>`;
 else if(f.t==='sum')inp=`<input id="${id}" type="text" readonly value="${esc(v)}" tabindex="-1">`;
 else if(f.t==='opp'){const o=RAW.opps.find(x=>x.id===v);inp=`<input id="f_oppQ" list="dl_opps" value="${esc(o?oppLabel(o):'')}" placeholder="예: 한빛제조 또는 품질예측" autocomplete="off"><input type="hidden" id="${id}" value="${esc(o?o.id:'')}"><div class="oppcard" id="oppCard"></div>`;return `<label class="fld load w2"><span>${esc(f.l)} <span class="hint">· ${esc(f.hint||'고객사나 기회명으로 검색해 고르세요')}</span></span>${inp}</label>`}
 else{const t=f.t==='num'?'number" step="any" inputmode="decimal':f.t==='date'?'date':'text';const l=f.t==='cust'?'dl_customer':f.t==='list'?'dl_'+f.src:'';inp=`<input id="${id}" type="${t}" value="${esc(v)}" ${l?`list="${l}"`:''} autocomplete="off">`}
 return `<label class="fld ${f.w===2?'w2':''}"><span>${esc(f.l)}${f.req?' *':''} ${f.hint?`<span class="hint">· ${esc(f.hint)}</span>`:''}</span>${inp}</label>`;
}

 if(ro)$('#frm').querySelectorAll('input,select,textarea').forEach(e=>e.disabled=true);

function calc(){
 if(M&&M.col==='opps'&&$('#f_amtSW')){const v=COMPS.map(([k])=>$('#f_'+k).value.trim());if(v.some(x=>x!==''&&num(x)!==0)||v.every(x=>x!==''))$('#f_amount').value=fmt(sum(v,x=>num(x))).replace(/,/g,'')}
 const c=$('#calc');if(!c||c.hidden)return;
 const a=num($('#f_amount')?.value),k=num($('#f_cost')?.value),st=$('#f_stage')?.value,pv=$('#f_prob')?.value;
 const p=pv!==undefined&&pv!==''?num(pv):(STAGES.find(s=>s.k===st)?.p??null);
 const miss=st?stageMissing({amount:a,cost:$('#f_cost')?.value,closeDate:$('#f_closeDate')?.value,product:$('#f_product')?.value,partner:$('#f_partner')?.value,compete:$('#f_compete')?.value},st):[];
 c.innerHTML=`<span>GP <b>${fmt(a-k)}</b> 백만원</span><span>GP율 <b>${pct(a-k,a)}%</b></span>${p!==null&&st?`<span>확도 ${p}% → 가중매출 <b>${fmt(a*p/100)}</b> 백만원</span>`:''}${miss.length?`<span style="color:var(--red);font-weight:700">‘${esc(st)}’ 단계 필수: ${esc(miss.join(', '))}</span>`:''}`;
}
async function save(e){
 e.preventDefault();const s=SCHEMA[M.col],o={};const err=$('#ferr');
 if($('#f_oppQ')&&$('#f_oppQ').value.trim()&&!$('#f_oppId').value){err.textContent='영업기회는 목록에서 골라 주세요.';$('#f_oppQ').focus();return}
 for(const f of s.fields){if(!f.k)continue;let v=$('#f_'+f.k).value.trim();if(f.t==='num'||f.t==='sum')v=v===''?null:num(v);if(f.req&&blank(v)){err.textContent=`${f.l}을(를) 입력해 주세요.`;$('#f_'+f.k).focus();return}o[f.k]=v}
 if(M.col==='opps'){const miss=stageMissing(o,o.stage);if(miss.length&&o.stage!=='실주'){err.textContent=`‘${o.stage}’ 단계로 저장하려면 ${miss.join(', ')}을(를) 입력해 주세요.`;return}}
 if(o.oppId&&'customer' in o&&!o.customer)o.customer=RAW.opps.find(x=>x.id===o.oppId)?.customer||'';
 const old=M.id?RAW[M.col].find(x=>x.id===M.id):null;const{id:_i,...rest}=old||{};
 const body={...rest,...o,updatedAt:Date.now()};if(!old)body.createdAt=Date.now();
 if(M.col==='approvals'&&(old?.status!==o.status)&&['승인','반려'].includes(o.status)){if(!canApprove(body)){err.textContent='승인·반려는 지정된 결재자만 할 수 있습니다.';return}body.decidedAt=TODAY}
 if(!db){err.textContent='저장소에 연결되지 않았습니다.';return}
 const ref=M.id?db.collection(M.col).doc(M.id):db.collection(M.col).doc();
 if(M.col==='opps'&&o.stage==='실주'&&(!old||old.stage!=='실주')){const cb=M.onSaved;openLost(null,body,ref.id,cb);return}
 try{await ref.set(body);
  if(M.col==='approvals'&&o.kind==='수주품의'&&o.status==='승인'&&o.oppId)await setStage(o.oppId,'수주');
  if(M.col==='activities'&&o.stageTo&&o.oppId)await setStage(o.oppId,o.stageTo);
  const cb=M.onSaved;closeM();if(cb)await cb(ref.id)}catch(x){err.textContent=x?.code==='quota_exceeded'?'저장 공간이 가득 찼습니다. 오래된 데이터를 정리해 주세요.':x?.code==='invalid_argument'?'저장 권한이 없거나 입력값이 올바르지 않습니다.':'저장하지 못했습니다. 잠시 후 다시 시도해 주세요.'}
}

async function saveLost(e){

}

async function sample(add){

  else{for(const col of Object.keys(SCHEMA))for(const x of RAW[col].filter(y=>y.sample))await db.collection(col).doc(x.id).delete()}

/* 영업단계 저장 */
async function saveStages(){
 const err=$('#stgErr');err.textContent='';
 const names=STG.map(s=>s.k.trim());
 if(names.some(n=>!n))return err.textContent='단계 이름을 비울 수 없습니다.';
 if(new Set(names).size!==names.length||names.some(n=>['수주','실주'].includes(n)))return err.textContent='단계 이름이 겹치거나 수주·실주와 같습니다.';
 const kept=new Set(STG.map(s=>s.orig).filter(Boolean));
 const removed=OPEN.filter(s=>!kept.has(s.k)&&RAW.opps.some(o=>o.stage===s.k));
 if(removed.length)return err.textContent=`‘${removed.map(s=>s.k).join(', ')}’ 단계에 기회가 남아 있어 삭제할 수 없습니다. 기회를 다른 단계로 옮긴 뒤 삭제하세요.`;
 const list=STG.map(s=>({k:s.k.trim(),p:Math.max(0,Math.min(100,num(s.p))),req:s.req}));
 try{await db.doc('config/stages').set({list,updatedAt:Date.now()});
  for(const s of STG)if(s.orig&&s.orig!==s.k.trim())for(const o of RAW.opps.filter(x=>x.stage===s.orig)){const{id,...r}=o;await db.collection('opps').doc(id).set({...r,stage:s.k.trim(),updatedAt:Date.now()})}
  STG=null;render();$('#net').textContent='영업단계 저장됨'}catch(x){err.textContent='저장하지 못했습니다. 관리자 권한이 필요합니다.'}
}

 if(t.dataset.convert){convertLead(t.dataset.convert);return}
 if(t.dataset.lost){openLost(t.dataset.lost);return}
 if(t.dataset.reopen){const o=RAW.opps.find(x=>x.id===t.dataset.reopen);if(!o)return;const{id,...r}=o;try{await db.collection('opps').doc(id).set({...r,stage:OPEN[OPEN.length-1].k,updatedAt:Date.now()});closeM()}catch(x){$('#ferr').textContent='저장하지 못했습니다.'}return}
 if(t.dataset.qadd){const o=RAW.opps.find(x=>x.id===M?.id);const amt=$('#q_amt').value;if(!o||amt===''){$('#q_amt').focus();return}const{id,...r}=o;const quotes=[...(Array.isArray(o.quotes)?o.quotes:[]),{date:$('#q_date').value||TODAY,amount:num(amt),memo:$('#q_memo').value.trim()}].sort((a,b)=>a.date>b.date?1:-1);try{await db.collection('opps').doc(id).set({...r,quotes,updatedAt:Date.now()});$('#quotes').innerHTML=quotesHTML({quotes})}catch(x){$('#ferr').textContent='견적을 저장하지 못했습니다.'}return}
 if(t.dataset.qdel){const o=RAW.opps.find(x=>x.id===M?.id);if(!o)return;const{id,...r}=o;const quotes=(o.quotes||[]).filter((_,i)=>i!==num(t.dataset.qdel));try{await db.collection('opps').doc(id).set({...r,quotes,updatedAt:Date.now()});$('#quotes').innerHTML=quotesHTML({quotes})}catch(x){}return}
 if(t.dataset.reg){const n=$('#reg_name').value.trim();if(!n){$('#reg_name').focus();return}try{await db.doc('reps/'+ME.id).set({name:n,createdAt:Date.now()})}catch(x){$('#net').textContent='이름을 등록하지 못했습니다'}return}
 if(t.dataset.unreg){try{await db.doc('reps/'+t.dataset.unreg).delete();await db.doc('roles/'+t.dataset.unreg).delete()}catch(x){$('#net').textContent='삭제하지 못했습니다'}return}
 if(t.dataset.org){const[a,i]=t.dataset.org.split(':');const n=num(i);if(!ORGD)return;
  if(a==='add')ORGD.teams.push({id:'t'+Date.now().toString(36),name:'새 팀'});
  if(a==='del')ORGD.teams.splice(n,1);
  if(a==='up'&&n>0)[ORGD.teams[n-1],ORGD.teams[n]]=[ORGD.teams[n],ORGD.teams[n-1]];
  if(a==='down'&&n<ORGD.teams.length-1)[ORGD.teams[n+1],ORGD.teams[n]]=[ORGD.teams[n],ORGD.teams[n+1]];
  if(a==='save'){await saveOrg();return}
  render();return}
 if(t.dataset.stg){const[a,i]=t.dataset.stg.split(':');const n=num(i);
  if(a==='add')STG.push({k:'새 단계',p:50,req:[],orig:null});
  if(a==='del')STG.splice(n,1);
  if(a==='up'&&n>0)[STG[n-1],STG[n]]=[STG[n],STG[n-1]];
  if(a==='down'&&n<STG.length-1)[STG[n+1],STG[n]]=[STG[n],STG[n+1]];
  if(a==='save'){await saveStages();return}
  render();return}
 if(t.dataset.new){const opp=t.dataset.opp,kind=t.dataset.kind;openForm(t.dataset.new);if(kind&&$('#f_kind'))$('#f_kind').value=kind;if(opp&&$('#f_oppQ')){const o=RAW.opps.find(x=>x.id===opp);if(o){$('#f_oppQ').value=oppLabel(o);loadOpp(true);$('#f_title')?.focus()}}return}
 if(t.dataset.edit){const[c,id]=t.dataset.edit.split(':');openForm(c,id);return}
 if(t.dataset.flow){const[id,s]=t.dataset.flow.split(':');const a=RAW.approvals.find(x=>x.id===id);if(!a)return;if(['승인','반려'].includes(s)&&!canApprove(a))return;const{id:_,...r}=a;const b={...r,status:s,updatedAt:Date.now()};if(['승인','반려'].includes(s))b.decidedAt=TODAY;try{await db.collection('approvals').doc(id).set(b);if(s==='승인'&&a.kind==='수주품의'&&a.oppId)await setStage(a.oppId,'수주')}catch(x){$('#net').textContent='저장하지 못했습니다'}return}

 if(t.id==='scopeSel'){F.scope=t.value;refreshMe();render();return}

function ogEdit(t){const[a,i]=t.dataset.og.split(':');if(!ORGD)return;if(a==='name')ORGD.name=t.value;if(a==='t'&&ORGD.teams[num(i)])ORGD.teams[num(i)].name=t.value}
function stEdit(t){const[a,i,k]=t.dataset.st.split(':');const s=STG[num(i)];if(!s)return;if(a==='k')s.k=t.value;if(a==='p')s.p=t.value;if(a==='r'){s.req=s.req.filter(x=>x!==k);if(t.checked)s.req.push(k)}}

async function init(){
 refreshMe();renderAll();const net=$('#net');
 if(!window.claude?.use){net.textContent='오프라인 미리보기';return}
 try{db=await window.claude.use('db')}catch(e){db=null}
 try{const u=await window.claude.use('user');if(u){const c=await u.can('data.write');if(c===false){canWrite=false;document.body.classList.add('ro')}ME.admin=!!(await u.canEdit());ME.id=await u.id()}}catch(e){}
 refreshMe();
 if(!db){net.textContent='저장소 연결 불가';render();return}
 const cols=Object.keys(SCHEMA),done=new Set(),need=cols.length+4;
 const timer=setTimeout(()=>{if(done.size<need)net.textContent='데이터 연결이 지연되고 있습니다'},10000);
 const ok=k=>{done.add(k);if(done.size===need){clearTimeout(timer);net.textContent=canWrite?'실시간 공유 중':'보기 전용'}};
 const fail=()=>{clearTimeout(timer);net.textContent='데이터를 불러오지 못했습니다'};
 const upd=()=>{refreshMe();render();if(M&&M.id&&SCHEMA[M.col]&&!RAW[M.col].some(x=>x.id===M.id))closeM()};
 cols.forEach(c=>db.collection(c).onSnapshot(s=>{RAW[c]=s.docs.map(d=>({...d.data(),id:d.id}));if(!s.metadata.fromCache)ok(c);upd()},fail));
 db.collection('reps').onSnapshot(s=>{REPS={};s.docs.forEach(d=>REPS[d.id]=d.data());if(!s.metadata.fromCache){repsLoaded=true;ok('reps')}upd()},fail);
 db.collection('roles').onSnapshot(s=>{ROLES={};s.docs.forEach(d=>ROLES[d.id]=d.data());if(!s.metadata.fromCache)ok('roles');upd()},fail);
 db.doc('config/org').onSnapshot(s=>{const d=s.exists?s.data():null;if(d&&Array.isArray(d.teams))ORGCFG={name:d.name||'AIDataPlatform',teams:d.teams};if(!s.metadata.fromCache)ok('org');if(route()!=='org')ORGD=null;upd()},fail);
 db.doc('config/stages').onSnapshot(s=>{setStages(s.exists?s.data().list:null);if(!s.metadata.fromCache)ok('config');if(!STG||route()!=='stages')STG=null;renderTree();upd()},fail);
}
init();
}
