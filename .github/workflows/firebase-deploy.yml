name: Firebase 배포 (영업관리 Sales Hub)

# GitHub 저장소 > Actions > "Firebase 배포" > Run workflow 버튼으로 실행합니다.
# 필요한 Secrets (Settings > Secrets and variables > Actions):
#   FIREBASE_PROJECT_ID       Firebase 프로젝트 ID (예: my-saleshub)
#   FIREBASE_WEB_CONFIG       콘솔 > 프로젝트 설정 > 내 앱(웹)의 firebaseConfig 내용
#   FIREBASE_SERVICE_ACCOUNT  콘솔 > 프로젝트 설정 > 서비스 계정 > 새 비공개 키(JSON) 파일 내용 전체
#   OWNER_EMAIL               소유자(관리자) 이메일, 여러 명이면 쉼표로 구분
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 배포본 만들기
        env:
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: python3 firebase/build.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Firebase 에 배포 (호스팅 + 보안 규칙)
        working-directory: firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13.29.1 deploy --only hosting,firestore:rules --project "$PROJECT_ID" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
